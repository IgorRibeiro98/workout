# Configuração PÚBLICA do release Android do Spark para o Google Play (T18.4).
#
# Este arquivo é o único dono dos valores operacionais que `ops/android/build-play-bundle.sh`
# compara contra o estado real antes de assinar um bundle. Ele é lido como `chave=valor` por uma
# função estrita do script (nunca com `source`), aceita apenas as chaves abaixo, e **não contém nem
# pode conter segredo**: nada aqui abre a upload key — o fingerprint é o do certificado público já
# registrado no Play Console, e a senha da keystore só existe na cabeça do operador e no prompt do
# `jarsigner`.
#
# Quando a upload key for redefinida no Play Console, é AQUI que o fingerprint canônico muda (ver
# docs/operations/ANDROID_PLAY_RELEASE.md, "Rotação da upload key"). A App Signing Key do Google
# Play não aparece neste arquivo e não é tocada por nenhum passo do fluxo.

# O único aplicativo que este fluxo pode empacotar. Um `applicationId` efetivo diferente é um
# release de outro app assinado com a chave do Spark — falha fechada.
EXPECTED_APPLICATION_ID=com.aistudio.workout.v2

# O endereço do Spark Backend em produção (Cloud Run, T18.2 → T18.3.2). O valor efetivo vem de
# `sparkBackendBaseUrl` (normalmente `~/.gradle/gradle.properties`); o build de release já recusa
# HTTP, localhost, 10.0.2.2 e rede privada (`app/build.gradle.kts`), e este fluxo exige, além
# disso, que o valor seja exatamente este — nem vazio (nuvem desligada), nem um staging esquecido.
EXPECTED_BACKEND_BASE_URL=https://spark-backend-965678405850.southamerica-east1.run.app

# SHA-1 do certificado PÚBLICO da upload key registrada no Play Console (informação pública).
# Caixa e separadores são normalizados antes da comparação.
EXPECTED_UPLOAD_CERT_SHA1=E1:32:79:F1:D1:79:C1:FE:4B:88:D1:54:A1:BB:A3:51:F2:35:E7:56

# `targetSdk` mínimo aceito para um envio ao Play (política do console desde 31/08/2026: API 36).
# `compileSdk` precisa ser >= `targetSdk`. Subir o projeto para uma API maior não exige mexer aqui;
# descer abaixo disto é recusado.
MIN_TARGET_SDK=36

# Onde a upload key privada vive, e sob que alias. Fora do repositório, sempre. Podem ser
# sobrescritos por ambiente (`SPARK_UPLOAD_KEYSTORE`, `SPARK_UPLOAD_KEY_ALIAS`) — o fingerprint
# acima continua sendo exigido seja qual for o arquivo usado.
DEFAULT_UPLOAD_KEYSTORE=~/.android/spark-upload.jks
DEFAULT_UPLOAD_KEY_ALIAS=spark-upload
