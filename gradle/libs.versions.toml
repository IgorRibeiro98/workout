# QR Code (T17.1).
#
# `zxing:core` é Java puro, sem nada de Android e sem `java.awt` (isso é o módulo `javase`, que
# NÃO entra aqui). Duas consequências que decidiram a escolha: o APK ganha um jar pequeno em vez
# de um SDK, e o encode/decode roda em **teste unitário de JVM** — é assim que o CI prova o
# round-trip do QR sem câmera, sem emulador e sem device.
zxingCore = "3.5.4"
# Leitura de QR (T17.1): o Google Code Scanner, do Play Services.
#
# Escolhido por uma razão específica: ele **não exige permissão de câmera**. A leitura acontece em
# uma UI do próprio Play Services, e o app recebe só o texto lido — nada de `CameraX`, nada de
# `android.permission.CAMERA` no manifesto, nada de detector próprio. Pedir permissão de câmera
# para ler um código de amigo seria um preço alto por uma tela que se usa três vezes na vida.
playServicesCodeScanner = "16.1.0"
googleServices = "4.4.2"


[libraries]
# Declarada explicitamente, e não por transitividade (T16.8).
#
# `androidx.activity` puxa `fragment:1.1.0` transitivamente, e o Gradle já resolvia isso para
# 1.5.7 em todo lugar — o APK sempre conteve 1.5.7. O `lintVitalRelease`, porém, lê a versão
# **declarada** e reprovava `assembleRelease` com `InvalidFragmentVersionForActivityResult`
# ("Upgrade Fragment version to at least 1.3.0"), bloqueando o build de release desde antes da
# T16.1.
#
# Declarar a versão que já era a resolvida faz o lint ver a verdade. Não é baseline (que esconderia
# problemas reais) e não muda um byte do que é empacotado.
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "androidxFragment" }
