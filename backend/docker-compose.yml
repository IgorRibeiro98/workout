# Spark Backend — composição local (PostgreSQL / T18.0).
#
# `docker compose up -d` sobe a fundação inteira: PostgreSQL e um processo backend.
# A persistência do PostgreSQL vive no volume nomeado `spark-pgdata`.

services:
  postgres:
    image: postgres:17-alpine
    container_name: spark-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: spark_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - spark-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spark -d spark_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: spark-backend:0.1.0
    container_name: spark-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://spark:spark@postgres:5432/spark_dev
      SOCIAL_MEDIA_ROOT: /media
      LOG_LEVEL: info
      SHUTDOWN_TIMEOUT_MS: 10000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - spark-media:/media
    stop_grace_period: 15s

volumes:
  spark-pgdata:
  spark-media:
