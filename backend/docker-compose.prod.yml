# Spark Backend — composição de PRODUÇÃO (T16.8).
#
#   Internet ──443/tcp──▶ Caddy (TLS automático) ──rede interna──▶ backend:8080 ──▶ PostgreSQL
#
# A diferença que importa em relação a `docker-compose.yml` (que é a composição **local**): aqui o
# backend **não publica porta nenhuma**. Ele existe apenas na rede interna do Compose, e a única
# coisa alcançável da internet é o Caddy, nas portas 80 e 443. Não há caminho para
# `http://IP:8080` — nem por engano, nem por regra de firewall esquecida.
#
# Subir:
#   cd /opt/spark/repo/backend
#   docker compose -f docker-compose.prod.yml up -d
#
# Passo a passo completo: ../docs/operations/PRODUCTION_DEPLOYMENT.md

services:
  caddy:
    # Versão fixada: um proxy que se atualiza sozinho é um proxy que muda de comportamento sem
    # deploy. Subir a versão é uma alteração neste arquivo, revisada como qualquer outra.
    image: caddy:2.10-alpine
    container_name: spark-caddy
    restart: unless-stopped
    ports:
      # As duas únicas portas da internet. 80 existe para o desafio HTTP-01 do ACME e para o
      # redirecionamento automático a HTTPS que o Caddy já faz.
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # O domínio real é configuração operacional, nunca código (§8). O Caddy substitui `{$...}`
      # na leitura do Caddyfile, então o mesmo arquivo versionado serve a qualquer domínio.
      SPARK_DOMAIN: "${SPARK_DOMAIN:?defina SPARK_DOMAIN no .env, ex. api.seudominio.com}"
      # E-mail do ACME: é para onde a Let's Encrypt avisa sobre expiração.
      SPARK_ACME_EMAIL: "${SPARK_ACME_EMAIL:?defina SPARK_ACME_EMAIL no .env}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados e chaves privadas de TLS. Volume nomeado de propósito: perdê-lo faz o Caddy
      # reemitir tudo, e reemissão repetida esbarra no rate limit da Let's Encrypt.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - backend
    logging: &json-logs
      # Rotação obrigatória (§65/§132). Sem isto, o log é o candidato mais provável a encher o
      # disco de uma VPS pequena — e disco cheio derruba a mídia, o ledger e o backup.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  backend:
    # Sem `build:` de propósito: produção sobe uma imagem **já construída e etiquetada** (§23/§107).
    # Quem constrói e etiqueta é `ops/deploy.sh`, a partir de um commit conferido. Editar código na
    # VPS e reconstruir na mão é exatamente o que este arquivo torna desnecessário.
    image: "spark-backend:${SPARK_IMAGE_TAG:?defina SPARK_IMAGE_TAG, use ops/deploy.sh}"
    container_name: spark-backend
    restart: unless-stopped
    # NENHUMA porta publicada. Quem fala com a internet é o Caddy.
    expose:
      - "8080"
    # O grupo compartilhado entre o host e o container (T16.8.1 §3).
    #
    # ## Por que isto existe
    #
    # O processo roda como `node` (uid 1000, `USER node` no Dockerfile) e **não pode rodar como
    # root**. O usuário `spark` do host recebe o uid que o `adduser` tiver livre: 1000 numa VPS
    # recém-criada, 1001 ou outro qualquer numa VPS onde já exista um usuário. A T16.8 documentava
    # `/opt/spark/data` como `1000:1000` e a service account como `spark:spark` — um arranjo que só
    # funcionava enquanto os dois números coincidissem **por acaso**. Na primeira VPS em que não
    # coincidissem, ou o backend não escreveria o ledger em `/data`, ou o operador não o leria.
    #
    # `group_add` remove o acaso: o container entra no grupo compartilhado e alcança
    # `/opt/spark/data` (2770) e `firebase-admin.json` (640) **pelo grupo**, com uid diferente do
    # operador, sem `chmod 777`, sem `chown` em runtime e sem root.
    #
    # Sem default de propósito: um valor herdado em silêncio seria o mesmo tipo de suposição que
    # esta linha existe para eliminar. O número sai de `getent group spark-data | cut -d: -f3`
    # (docs/operations/PRODUCTION_DEPLOYMENT.md, "usuários, grupos e permissões").
    group_add:
      - "${SPARK_DATA_GID:?defina SPARK_DATA_GID no .env: getent group spark-data | cut -d: -f3}"
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: "${DATABASE_URL:?defina DATABASE_URL no .env}"
      # Opcional: a conexão direta (sem pooler) para migrations. Quando o `.env` não a define, o
      # Compose entrega **string vazia** — e o backend trata vazio como ausente, caindo em
      # `DATABASE_URL` (T18.0.2). Esta linha fica assim de propósito: é o caminho real de produção,
      # e o smoke de topologia do CI o exercita sem a variável definida.
      DATABASE_URL_DIRECT: "${DATABASE_URL_DIRECT:-}"
      # T17.9 §26/§28 — a mídia social vive em volume persistente, e o caminho é **obrigatório**
      # em produção: `AppConfig.missingRequirements()` derruba o startup se ele faltar. Um default
      # silencioso apontaria para a camada efêmera do container, e a foto de todo mundo sumiria no
      # próximo `up` sem erro, sem log e sem ninguém perceber até alguém abrir o Feed.
      SOCIAL_MEDIA_ROOT: /media
      LOG_LEVEL: ${SPARK_LOG_LEVEL:-info}
      # UTC para tudo o que é técnico (§124/§126). O sync não depende de relógio para causalidade,
      # mas log, certificado e nome de backup dependem de um horário que não mude duas vezes por ano.
      TZ: UTC
      SHUTDOWN_TIMEOUT_MS: 10000
      HTTP_REQUEST_TIMEOUT_MS: 120000
      HTTP_KEEP_ALIVE_TIMEOUT_MS: 65000
      # Em produção, subir sem conseguir verificar identidade é subir quebrado: melhor falhar de
      # forma visível do que responder 503 em cada requisição parecendo instabilidade.
      REQUIRE_FIREBASE_ADMIN: "true"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
      # Interruptores de operação. Ver docs/operations/RUNBOOK.md para quando usar cada um.
      AI_ENABLED: ${SPARK_AI_ENABLED:-true}
      SYNC_WRITE_ENABLED: ${SPARK_SYNC_WRITE_ENABLED:-true}
      MAINTENANCE_MODE: ${SPARK_MAINTENANCE_MODE:-false}
    env_file:
      # A credencial do Gemini e qualquer outro segredo de runtime vêm daqui — um arquivo com
      # permissão 600, fora do Git, que existe só nesta máquina.
      - path: ${SPARK_SECRETS_DIR:-/opt/spark/secrets}/backend.env
        required: false
    volumes:
      # Bind mount, e não volume nomeado, para produção: arquivos operacionais e ledgers
      # (como deletion_tombstones.tsv) precisam ser inspecionáveis pelo host com um `ls`.
      # Derrubar e recriar o container não toca neste diretório.
      - ${SPARK_DATA_DIR:-/opt/spark/data}:/data
      # A mídia social (T17.9 §26). Bind mount separado pelo mesmo motivo do `/data`:
      # `ops/backup.sh` precisa enxergá-la do host, e "onde estão as fotos?" precisa ter resposta
      # com um `ls`. Separada de `/data` porque a mídia é deduplicada pelo restic.
      #
      # Derrubar e recriar o container não toca neste diretório, que é a única razão de ele
      # existir: a T17.9 recusa produção sem ele (§28).
      - ${SPARK_MEDIA_DIR:-/opt/spark/media}:/media
      # A service account entra por montagem somente-leitura, a partir de um arquivo que existe só
      # nesta VPS. Ela nunca entra na imagem nem no Git (§53).
      #
      # Somente-leitura continua sendo somente-leitura: o `ro` protege contra o container escrever
      # nela. Quem garante que ele consegue **ler** é o grupo compartilhado acima — o arquivo é
      # `640` no grupo `spark-data`, e não `600` do dono. Com `REQUIRE_FIREBASE_ADMIN=true`, uma
      # credencial ilegível agora derruba o startup (T16.8.1 §8) em vez de virar `503` silencioso.
      - ${SPARK_SECRETS_DIR:-/opt/spark/secrets}/firebase-admin.json:/run/secrets/firebase-admin.json:ro
    stop_grace_period: 15s
    logging: *json-logs
    deploy:
      resources:
        limits:
          # Teto generoso, não apertado (§73): o processo é um Node com PostgreSQL via pool e um
          # backup de até 4 MiB em memória durante a validação. Matar o container por OOM no meio
          # de um upload seria criar o incidente que o limite deveria evitar. O objetivo aqui é
          # conter um vazamento, não espremer o serviço.
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M

volumes:
  caddy-data:
  caddy-config:
