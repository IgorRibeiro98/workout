# CI do Spark Backend (T16.0 → T16.8.1).
#
# Escopo deliberadamente restrito a `backend/**` e `ops/**`. O Android tem o próprio workflow desde
# a T16.7.1 (`android.yml`), e os dois não se misturam: eles têm gatilhos, toolchain e tempo de
# execução diferentes, e juntá-los faria uma mudança de documentação do backend recompilar o app.
#
# Nada neste workflow depende de rede além do registro do npm: **sem Firebase, sem Gemini, sem
# VPS, sem credencial**. Os testes do Coach (T16.2) usam `FakeAiProviderGateway` e
# `FakeAuthTokenVerifier`, que vivem só em `test/`: não existe `GEMINI_API_KEY` aqui, e uma
# chamada real ao modelo em CI seria custo recorrente por commit. Se algum job precisar de segredo
# no futuro, isso é uma decisão nova.
#
# ## Diretório de trabalho: por job, nunca global (T16.8.1 §6)
#
# Havia um `defaults.run.working-directory: backend` no topo deste arquivo, e ele quebrava em
# silêncio todo job que operasse a partir da raiz: o `backup-drill` fazia
# `docker build -t spark-backend:local backend` e recebia `path "backend" not found`, porque o
# caminho resolvia para `backend/backend`. O ensaio de backup **nunca chegou a rodar** — o job
# falhava no primeiro passo, e o CI ficava vermelho por um erro de caminho em vez de por um
# problema de backup.
#
# Agora cada job declara o seu. Os que rodam `npm` declaram `backend`; os que operam a árvore
# inteira (`ops/`, compose, drill) declaram a raiz, explicitamente.

name: backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      # Os scripts operacionais entram no CI desde a T16.8: eles falam com o banco de produção,
      # e um defeito neles é um backup que não acontece.
      - 'ops/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'ops/**'
      - '.github/workflows/backend.yml'

jobs:
  verify:
    name: lint + test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `npm ci` (e não `npm install`): instala exatamente o lockfile e falha se ele divergir
      # do package.json. É o que torna o build reproduzível.
      - name: Install (determinístico)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Gate de segurança de dependências (T16.8 §93/§96).
      #
      # `--omit=dev` de propósito: o que roda em produção é a árvore de produção. Uma
      # vulnerabilidade no `@nestjs/cli` é um problema de máquina de desenvolvimento, tem
      # prioridade diferente e não pode bloquear um deploy de correção.
      #
      # `--audit-level=high` barra **high e critical**. Moderadas não bloqueiam: hoje as que
      # existem estão todas numa cadeia transitiva de `firebase-admin` que o backend não alcança,
      # e `test/dependency-security.spec.ts` é quem garante que ela continue inalcançável — um
      # import de `firebase-admin/storage` quebra aquele teste, não este gate.
      #
      # Se este passo falhar: trate a vulnerabilidade deliberadamente. `npm audit fix --force` é
      # proibido (§95) — ele sobe major sem revisão para zerar o relatório.
      - name: Auditoria de dependências (runtime)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: docker build
    runs-on: ubuntu-latest
    defaults:
      run:
        # Este job constrói a imagem a partir do contexto `backend/`, então o `.` abaixo é ele.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t spark-backend:ci .

      # Sobe a imagem de verdade com um volume, confere o health e valida que o dado sobrevive
      # à destruição e recriação do container — o invariante que a T16.0 precisa garantir.
      - name: Smoke test (health + persistência + schema de restore)
        run: |
          set -euo pipefail
          docker volume create spark-ci-data
          docker volume create spark-ci-media
          docker run -d --name spark-ci -p 127.0.0.1:8080:8080 \
            -v spark-ci-data:/data -v spark-ci-media:/media spark-backend:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/live > /dev/null 2>&1; then break; fi
            if [ "$i" = "30" ]; then echo "backend não subiu"; docker logs spark-ci; exit 1; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/health/live | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/health/ready | grep -q '"status":"ok"'

          docker exec spark-ci node -e "
            const S=require('/app/node_modules/better-sqlite3');
            const db=new S('/data/spark.db');
            db.prepare('INSERT INTO server_metadata (key,value,updated_at) VALUES (?,?,?)')
              .run('ci_persistencia','sobreviveu',1);
            db.close();"

          # T17.9 §26 — a mídia social vive em volume, e não na camada efêmera do container. Sem
          # este par de passos, um `VOLUME` removido do Dockerfile por engano não quebraria teste
          # nenhum: passaria a apagar a foto de todo mundo a cada recriação, em silêncio.
          docker exec spark-ci node -e "
            const sharp=require('sharp'); const fs=require('node:fs');
            (async()=>{
              fs.mkdirSync('/media/checkins/aa/bb',{recursive:true});
              const bytes=await sharp({create:{width:32,height:32,channels:3,background:{r:1,g:2,b:3}}}).webp().toBuffer();
              fs.writeFileSync('/media/checkins/aa/bb/aabb0000-0000-4000-8000-000000000001.webp',bytes);
              console.log('mídia escrita no volume:', bytes.length, 'bytes');
            })();"

          # O container roda como usuário sem privilégio (T16.8 §12). Um `USER node` removido por
          # engano num refactor do Dockerfile não quebra nenhum teste — só passa a rodar como root.
          uid="$(docker exec spark-ci id -u)"
          if [ "$uid" = "0" ]; then echo "o container não pode rodar como root"; exit 1; fi
          echo "container roda como uid $uid"

          # Graceful shutdown (T16.8 §71/§72): uma requisição em voo precisa terminar, e o
          # SQLite precisa ser fechado com checkpoint. `docker stop` manda SIGTERM e espera.
          ( curl -sS -o /tmp/inflight.body -w '%{http_code}' --max-time 20 \
              http://127.0.0.1:8080/v1/auth/me > /tmp/inflight.code & )
          docker stop -t 15 spark-ci > /dev/null
          inflight="$(cat /tmp/inflight.code 2>/dev/null || true)"
          if [ "$inflight" != "401" ]; then
            echo "a requisição em voo não foi drenada (código: ${inflight:-nenhum})"; exit 1
          fi
          if [ "$(docker inspect spark-ci --format '{{.State.ExitCode}}')" != "0" ]; then
            echo "o processo não saiu limpo em SIGTERM"; docker logs spark-ci; exit 1
          fi
          docker logs spark-ci 2>&1 | grep -q 'server.shutdown.forced' && {
            echo "o shutdown precisou ser forçado"; exit 1; }
          echo "graceful shutdown ok"

          docker rm -f spark-ci
          docker run -d --name spark-ci-2 -p 127.0.0.1:8080:8080 \
            -v spark-ci-data:/data -v spark-ci-media:/media spark-backend:ci

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready > /dev/null 2>&1; then break; fi
            if [ "$i" = "30" ]; then echo "backend não subiu"; docker logs spark-ci-2; exit 1; fi
            sleep 2
          done

          docker exec spark-ci-2 node -e "
            const S=require('/app/node_modules/better-sqlite3');
            const db=new S('/data/spark.db');
            const row=db.prepare('SELECT value FROM server_metadata WHERE key=?').get('ci_persistencia');
            if (!row || row.value !== 'sobreviveu') {
              console.error('dado não sobreviveu à recriação do container'); process.exit(1);
            }
            console.log('persistência ok');
            db.close();"

          docker exec spark-ci-2 node -e "
            const fs=require('node:fs');
            const file='/media/checkins/aa/bb/aabb0000-0000-4000-8000-000000000001.webp';
            if (!fs.existsSync(file)) {
              console.error('a mídia não sobreviveu à recriação do container'); process.exit(1);
            }
            const head=fs.readFileSync(file).subarray(8,12).toString('ascii');
            if (head !== 'WEBP') { console.error('a mídia restaurada não é WebP'); process.exit(1); }
            console.log('persistência da mídia ok');"

          # A raiz de mídia é obrigatória em produção (T17.9 §28): um container sem ela precisa
          # **falhar no startup**, e não subir escrevendo em disco efêmero.
          if docker run --rm -e NODE_ENV=production -e DATABASE_PATH=/data/spark.db \
               -e SOCIAL_MEDIA_ROOT= spark-backend:ci > /tmp/nomedia.log 2>&1; then
            echo "o backend subiu sem SOCIAL_MEDIA_ROOT em produção"; cat /tmp/nomedia.log; exit 1
          fi
          grep -q 'SOCIAL_MEDIA_ROOT' /tmp/nomedia.log || {
            echo "a falha não citou SOCIAL_MEDIA_ROOT"; cat /tmp/nomedia.log; exit 1; }
          echo "produção recusa subir sem SOCIAL_MEDIA_ROOT" 

          # T16.5/T16.6/T16.7 — o schema do restore, o do sync incremental e o do tombstone.
          #
          # Sem service account não há como autenticar aqui, e é exatamente isso que o smoke
          # verifica: as rotas existem e nascem **fechadas**. 401 (e não 404) é a prova.
          docker exec spark-ci-2 node -e "
            const S=require('/app/node_modules/better-sqlite3');
            const db=new S('/data/spark.db');
            const columns=db.prepare('PRAGMA table_info(backup_snapshots)').all().map(c=>c.name);
            if (!columns.includes('payload')) {
              console.error('migration 0004 não aplicada: sem coluna payload'); process.exit(1);
            }
            for (const table of ['sync_entities','sync_changes','sync_mutations']) {
              const found=db.prepare(
                \"SELECT name FROM sqlite_master WHERE type='table' AND name=?\"
              ).get(table);
              if (!found) {
                console.error('migration 0005 não aplicada: sem tabela ' + table); process.exit(1);
              }
            }
            const entity=db.prepare('PRAGMA table_info(sync_entities)').all().map(c=>c.name);
            for (const column of ['deleted','deleted_at','deleted_by_device_id']) {
              if (!entity.includes(column)) {
                console.error('migration 0006 não aplicada: sem coluna ' + column); process.exit(1);
              }
            }
            const applied=db.prepare('SELECT COUNT(*) AS total FROM schema_migrations').get();
            if (applied.total < 6) {
              console.error('migrations pendentes: ' + applied.total); process.exit(1);
            }
            console.log('schema de restore, de sync e de tombstone ok');
            db.close();"

          for path in /v1/backups /v1/backups/abc /v1/backups/abc/content /v1/sync/pull \
                      /v1/sync/entities/WORKOUT_TEMPLATE/abc; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$path")
            if [ "$status" != "401" ]; then
              echo "rota $path deveria exigir autenticação; respondeu $status"; exit 1
            fi
          done

          # O push é POST: um GET nele responderia 404 e não provaria nada sobre a proteção.
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{}' \
            "http://127.0.0.1:8080/v1/sync/push")
          if [ "$status" != "401" ]; then
            echo "rota /v1/sync/push deveria exigir autenticação; respondeu $status"; exit 1
          fi

          docker rm -f spark-ci-2
          docker volume rm spark-ci-data spark-ci-media

  ops-scripts:
    name: shellcheck dos scripts operacionais
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      # `ops/backup.sh` e `ops/restore.sh` mexem no banco de produção e no repositório de backup.
      # Um `$VAR` sem aspas ali é um caminho com espaço que vira dois argumentos — e um backup que
      # não acontece. O shellcheck já vem instalado no runner do GitHub.
      #
      # `ops/tests/` entra junto: um teste operacional com defeito de shell dá falso verde, que é
      # a única coisa pior que não ter o teste.
      #
      # Os avisos são **corrigidos**, nunca silenciados em bloco (T16.8.1 §5). As duas únicas
      # supressões que restam em `ops/` são pontuais e documentadas na linha de cima: `SC2086` onde
      # a divisão em palavras é o comportamento pretendido (`SPARK_RESTIC_CMD` carrega comando com
      # argumentos) e `SC1090`/`SC1091` onde o caminho do `source` é configuração operacional e não
      # existe em tempo de análise.
      - name: shellcheck
        run: shellcheck ops/*.sh ops/tests/*.sh

      # Nenhuma supressão em bloco (T16.8.1 §5): a saída fácil para deixar o passo acima verde é
      # um `# shellcheck disable=` com meia dúzia de códigos no topo do arquivo, e ela apaga os
      # avisos junto com os defeitos que eles descrevem.
      - name: Nenhuma supressão de ShellCheck em bloco
        run: |
          set -euo pipefail
          if grep -rn 'shellcheck disable=.*,' ops/; then
            echo "supressão de múltiplos códigos numa linha só: trate cada aviso"; exit 1
          fi
          # Uma supressão precisa vir acompanhada da explicação, na linha de cima ou na de baixo.
          while IFS=: read -r file line _; do
            vizinhas="$(sed -n "$((line - 1))p;$((line + 1))p" "$file")"
            case "$vizinhas" in
              *'#'*) : ;;
              *) echo "$file:$line — supressão sem justificativa adjacente"; exit 1 ;;
            esac
          done < <(grep -rn 'shellcheck disable=' ops/ || true)
          echo "supressões pontuais e justificadas"

      # A proibição de `777`/`666` (T16.8 §145/§146). Ela existia como regra escrita e não como
      # verificação — e `ops/verify-backup.sh` tinha um `chmod 777` no ensaio de restauração, que
      # além de proibido tornava o ensaio incapaz de detectar o problema de permissão que ele
      # deveria detectar.
      - name: Nenhum chmod aberto nos scripts operacionais
        run: |
          set -euo pipefail
          # `^[^#]*` exclui comentário: a regra precisa poder ser **explicada** nos arquivos que a
          # aplicam, e uma verificação que proíbe escrever o número em um comentário proibiria
          # justamente o texto que impede alguém de reintroduzi-lo.
          if grep -rnE '^[^#]*chmod ([0-7]?)(777|666|776|667)' \
               ops/ backend/docker-compose*.yml backend/Dockerfile; then
            echo "permissão aberta em caminho operacional: use o grupo compartilhado (T16.8.1 §3)"
            exit 1
          fi
          echo "nenhuma permissão aberta"

      - name: Sintaxe das unidades systemd
        run: |
          set -euo pipefail
          # `systemd-analyze verify` exigiria as unidades instaladas e o binário do serviço
          # presente. O que dá para verificar de forma útil aqui é o que quebra em silêncio: uma
          # unidade sem as seções obrigatórias.
          for unit in ops/systemd/*.service; do
            grep -q '^\[Unit\]'    "$unit" || { echo "$unit: sem [Unit]"; exit 1; }
            grep -q '^\[Service\]' "$unit" || { echo "$unit: sem [Service]"; exit 1; }
            grep -q '^ExecStart='   "$unit" || { echo "$unit: sem ExecStart"; exit 1; }
          done
          for unit in ops/systemd/*.timer; do
            grep -q '^\[Timer\]'      "$unit" || { echo "$unit: sem [Timer]"; exit 1; }
            grep -q '^OnCalendar='     "$unit" || { echo "$unit: sem OnCalendar"; exit 1; }
          done
          echo "unidades ok"

      # O Caddyfile de produção é código de infraestrutura: um erro de sintaxe nele é o proxy que
      # não sobe depois de um deploy — descoberto na VPS, no pior momento.
      - name: Caddyfile de produção é válido
        run: |
          set -euo pipefail
          docker run --rm \
            -e SPARK_DOMAIN=api.exemplo.invalid \
            -e SPARK_ACME_EMAIL=ops@exemplo.invalid \
            -v "$PWD/backend/Caddyfile.prod:/etc/caddy/Caddyfile:ro" \
            caddy:2.10-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # A documentação operacional não pode contradizer a topologia (T16.8.1 §24).
      #
      # Enquanto `docker-compose.prod.yml` não publicar a porta do backend, nenhum documento pode
      # mandar o operador rodar `curl http://127.0.0.1:8080` **no host**: esse comando não pode
      # funcionar, e um runbook que o recomenda leva quem está diagnosticando a concluir que o
      # backend está morto. Explicar que ele NÃO funciona continua permitido — a verificação só
      # olha linhas que são comandos.
      - name: A documentação não recomenda a porta que produção não publica
        run: |
          set -euo pipefail
          # `docs/operations/` apenas: é a documentação de **produção**. `docs/FIREBASE_AUTH_SETUP.md`
          # descreve a composição local (`docker-compose.yml`), que publica 127.0.0.1:8080 de
          # propósito — e o comando de lá está certo justamente porque fala de outra topologia.
          if grep -rnE '^[[:space:]]*curl [^|]*127\.0\.0\.1:8080' docs/operations/; then
            echo "documentação mandando falar com uma porta que produção não publica (T16.8.1 §24)"
            exit 1
          fi
          echo "documentação coerente com a topologia"

      # O compose de produção precisa continuar não publicando a porta do backend. É a diferença
      # entre "o backend fica atrás do Caddy" e "o backend está na internet na porta 8080".
      - name: O compose de produção não expõe o backend
        run: |
          set -euo pipefail
          cd backend
          # `SPARK_DATA_GID` entra aqui porque o compose de produção o declara obrigatório
          # (`${VAR:?}`) desde a T16.8.1 — o valor não importa para conferir a topologia, mas sem
          # ele o Compose nem interpola o arquivo.
          resolved="$(SPARK_DOMAIN=api.exemplo.invalid SPARK_ACME_EMAIL=ops@exemplo.invalid \
            SPARK_DATA_GID=1 SPARK_IMAGE_TAG=ci docker compose -f docker-compose.prod.yml config)"
          # Só o Caddy publica portas. Se `8080` aparecer publicado, o teste falha.
          if printf '%s' "$resolved" | grep -A6 'container_name: spark-backend' | grep -q 'published:'; then
            echo "o serviço backend não pode publicar portas em produção"; exit 1
          fi
          printf '%s' "$resolved" | grep -q 'published: "443"' || { echo "o Caddy precisa publicar 443"; exit 1; }
          echo "topologia de produção ok"

  production-topology:
    name: topologia de produção (compose real)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      # A topologia de produção, subida de verdade (T16.8.1 §11).
      #
      # `docker compose config` prova o que o YAML diz. Ele não prova que a pilha sobe, que o Caddy
      # alcança o backend pela rede interna, que o health operacional funciona **sem porta
      # publicada** ou que o bind mount persiste. Este job sobe `docker-compose.prod.yml` — o
      # arquivo de produção, sem alteração nenhuma no serviço `backend` — e verifica as quatro.
      #
      # A única adaptação é a porta do host em que o Caddy é publicado
      # (`docker-compose.ci-topology.yml`), porque 80/443 nem sempre estão livres. TLS real
      # continua `NOT VERIFIED`: não há domínio nem DNS aqui, e depender da Let's Encrypt no CI
      # seria uma dependência externa por commit.
      - name: Build image
        run: docker build -t spark-backend:topology backend

      - name: Configuração da VPS, reproduzida no runner
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          echo "SPARK_WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/data" "$WORK/secrets" "$WORK/state" "$WORK/backups"

          # O modelo de permissão da T16.8.1 §3: setgid + grupo compartilhado, nunca 777.
          # O uid do runner (1001) já é diferente do uid do container (1000, `node`), que é
          # exatamente o caso que a T16.8 não cobria.
          chmod 2770 "$WORK/data"
          chmod 2750 "$WORK/secrets"
          echo "uid do host: $(id -u); gid compartilhado: $(id -g)"
          if [ "$(id -u)" = "1000" ]; then
            echo "AVISO: o uid do host coincide com o do container; este job prova menos do que deveria."
            echo "O teste que constrói o desencontro de propósito é ops/tests/permissions.test.sh."
          fi

          # Service account **sintética**: chave RSA descartável, projeto que não existe, gerada
          # aqui e jogada fora com o runner. Nenhuma credencial real entra no CI (§164). Ela existe
          # porque o compose de produção declara `REQUIRE_FIREBASE_ADMIN=true`, e desde a T16.8.1
          # §8 isso é verificado de verdade no startup — uma credencial ilegível derruba o processo.
          # `--user` é o operador do host, e não o `node` da imagem: `$WORK/secrets` pertence ao
          # runner (uid 1001) em modo 2750, e um container rodando como uid 1000 não escreve nele.
          # Na VPS quem cria a service account também é o operador — este passo reproduz isso.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$WORK/secrets:/s" --entrypoint node spark-backend:topology -e "
            const { generateKeyPairSync } = require('node:crypto');
            const { writeFileSync, chmodSync } = require('node:fs');
            const { privateKey } = generateKeyPairSync('rsa', {
              modulusLength: 2048,
              privateKeyEncoding: { type: 'pkcs8', format: 'pem' },
              publicKeyEncoding: { type: 'spki', format: 'pem' },
            });
            writeFileSync('/s/firebase-admin.json', JSON.stringify({
              type: 'service_account',
              project_id: 'ci-only-not-a-real-firebase-project',
              private_key_id: '0'.repeat(40),
              private_key: privateKey,
              client_email: 'ci@ci-only-not-a-real-firebase-project.iam.gserviceaccount.com',
              client_id: '0'.repeat(21),
              token_uri: 'https://oauth2.googleapis.com/token',
            }, null, 2));
            chmodSync('/s/firebase-admin.json', 0o640);
          "
          # 640 no grupo compartilhado, e não 600 do dono: legível pelo container, e não pela
          # máquina inteira.
          test "$(stat -c %a "$WORK/secrets/firebase-admin.json")" = "640"

          cp backend/Caddyfile.prod backend/Caddyfile
          cat > backend/.env <<EOF
          SPARK_DOMAIN=http://localhost
          SPARK_ACME_EMAIL=ops@exemplo.invalid
          SPARK_DATA_DIR=$WORK/data
          SPARK_SECRETS_DIR=$WORK/secrets
          SPARK_DATA_GID=$(id -g)
          SPARK_CI_HTTP_PORT=8081
          EOF

      - name: A pilha de produção sobe, e o backend continua inalcançável do host
        run: |
          set -euo pipefail
          cd backend
          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.ci-topology.yml"
          SPARK_IMAGE_TAG=topology $COMPOSE up -d

          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://localhost:8081/health/ready 2>/dev/null \
               | grep -q '"status":"ok"'; then break; fi
            if [ "$i" = "30" ]; then
              SPARK_IMAGE_TAG=topology $COMPOSE logs; exit 1
            fi
            sleep 2
          done

          # A invariante central da T16.8: o backend não publica porta. Não é conferido no YAML —
          # é conferido tentando alcançá-lo.
          if curl -fsS --max-time 3 http://127.0.0.1:8080/health/ready > /dev/null 2>&1; then
            echo "FALHA: o backend está publicado em 127.0.0.1:8080"; exit 1
          fi
          # `docker inspect`, e não `docker compose port`: para uma porta não publicada o `port`
          # imprime `invalid IP:0` em stdout e sai com 0, o que faz qualquer verificação por texto
          # concluir o contrário do que aconteceu. `PortBindings` é o que o Docker realmente
          # aplicou, e para um serviço só com `expose` ele é `{}`.
          bindings="$(docker inspect spark-backend --format '{{json .HostConfig.PortBindings}}')"
          if [ "$bindings" != "{}" ] && [ "$bindings" != "null" ]; then
            echo "FALHA: o serviço backend publicou porta no host: $bindings"; exit 1
          fi
          echo "ok: o backend só existe na rede interna (PortBindings=$bindings)"

          # E a sobreposição do CI não pode ter tocado no backend.
          resolved="$(SPARK_IMAGE_TAG=topology $COMPOSE config)"
          if printf '%s' "$resolved" | grep -A8 'container_name: spark-backend' | grep -q 'published:'; then
            echo "FALHA: a sobreposição do CI publicou a porta do backend"; exit 1
          fi

          # O proxy alcança o backend pela rede interna, e a rota de dado nasce fechada.
          curl -fsS http://localhost:8081/health/live | grep -q '"status":"ok"'
          status="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/v1/backups)"
          [ "$status" = "401" ] || { echo "rota protegida respondeu $status pelo proxy"; exit 1; }
          echo "ok: Caddy alcança o backend e a rota exige autenticação"

      - name: O health operacional funciona sem porta publicada
        run: |
          set -euo pipefail
          # Sem NENHUMA variável do compose no ambiente: é assim que `ops/check-health.sh` roda pelo
          # systemd. O Compose interpola o arquivo inteiro antes de qualquer subcomando, e um
          # `${VAR:?}` não resolvido derrubava até um `ps` — o healthcheck reportava "o backend não
          # respondeu" com o backend no ar (T16.8.1 §2).
          export SPARK_COMPOSE_DIR="$PWD/backend"
          export SPARK_COMPOSE_FILE=docker-compose.prod.yml
          export SPARK_DATA_DIR="$SPARK_WORK/data"
          export SPARK_STATE_DIR="$SPARK_WORK/state"
          export SPARK_STAGING_DIR="$SPARK_WORK/backups"
          export SPARK_BACKUP_ENV_FILE=/dev/null

          # shellcheck source=ops/lib.sh
          . ops/lib.sh
          spark_health ready | grep -q '"status":"ok"' || { echo "health interno falhou"; exit 1; }
          spark_health live  | grep -q '"status":"ok"' || { echo "liveness interno falhou"; exit 1; }
          echo "ok: health interno pelo compose, sem porta publicada e sem variáveis no ambiente"

          # O health público é uma verificação SEPARADA, e opcional: ela só existe quando há
          # domínio e certificado. Um problema de DNS não pode parecer um backend morto.
          SPARK_PUBLIC_HEALTH_URL=http://localhost:8081 ops/check-health.sh 2>&1 | tee /tmp/health.log || true
          grep -q 'liveness ok' /tmp/health.log
          grep -q 'readiness ok' /tmp/health.log
          grep -q 'health público ok' /tmp/health.log

          # E o modelo de permissão precisa aparecer no diagnóstico: um `chmod 777` "para resolver"
          # é acusado aqui, não descoberto depois.
          grep -q 'permissões de .*: 2770' /tmp/health.log

      - name: O dado sobrevive à recriação dos containers
        run: |
          set -euo pipefail
          cd backend
          COMPOSE="docker compose -f docker-compose.prod.yml -f docker-compose.ci-topology.yml"
          SPARK_IMAGE_TAG=topology $COMPOSE exec -T backend node -e "
            const D=require('better-sqlite3'); const db=new D('/data/spark.db');
            db.prepare('INSERT OR REPLACE INTO server_metadata (key,value,updated_at) VALUES (?,?,?)')
              .run('topologia','persistiu',Date.now()); db.close();"

          SPARK_IMAGE_TAG=topology $COMPOSE down
          SPARK_IMAGE_TAG=topology $COMPOSE up -d
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://localhost:8081/health/ready 2>/dev/null \
               | grep -q '"status":"ok"'; then break; fi
            if [ "$i" = "30" ]; then SPARK_IMAGE_TAG=topology $COMPOSE logs; exit 1; fi
            sleep 2
          done

          SPARK_IMAGE_TAG=topology $COMPOSE exec -T backend node -e "
            const D=require('better-sqlite3'); const db=new D('/data/spark.db');
            const row=db.prepare('SELECT value FROM server_metadata WHERE key=?').get('topologia');
            if (!row || row.value !== 'persistiu') {
              console.error('o dado não sobreviveu ao bind mount'); process.exit(1);
            }
            console.log('persistência ok no bind mount'); db.close();"

          SPARK_IMAGE_TAG=topology $COMPOSE down -v

      # `ops/deploy.sh` exercitado de verdade (T16.8.1 §12).
      #
      # Não é um deploy em VPS: é a mesma composição de produção, no runner. O que precisa ser
      # provado são as três garantias que o script existe para dar — backup antes do deploy, health
      # depois do deploy, rollback quando o health falha — e nenhuma delas é verificável lendo o
      # arquivo.
      - name: deploy.sh — health interno, rollback e o portão de backup
        run: |
          set -euo pipefail
          export SPARK_COMPOSE_DIR="$PWD/backend"
          export SPARK_COMPOSE_FILE=docker-compose.prod.yml
          export SPARK_DATA_DIR="$SPARK_WORK/data"
          export SPARK_STATE_DIR="$SPARK_WORK/state"
          export SPARK_STAGING_DIR="$SPARK_WORK/backups"
          export SPARK_BACKUP_ENV_FILE=/dev/null
          export SPARK_HEALTH_ATTEMPTS=25

          docker tag spark-backend:topology spark-backend:baseline
          running_tag() {
            docker inspect spark-backend --format '{{.Config.Image}}' 2>/dev/null | sed 's/.*://'
          }

          echo "--- 1. rollback para uma imagem conhecida: health interno, sem porta publicada ---"
          ops/deploy.sh --rollback baseline
          [ "$(running_tag)" = "baseline" ] || { echo "a tag no ar não é baseline"; exit 1; }

          echo "--- 2. health falhando: rollback automático para a versão anterior ---"
          # `SPARK_HEALTH_URL` apontando para uma porta morta força o caminho de falha usando a
          # configuração de verdade, sem quebrar o script para testá-lo.
          set +e
          SPARK_HEALTH_URL=http://127.0.0.1:59999 SPARK_HEALTH_ATTEMPTS=2 \
            ops/deploy.sh --skip-backup > /tmp/deploy-falha.log 2>&1
          code=$?
          set -e
          [ "$code" != "0" ] || { echo "o deploy declarou sucesso com health falhando"; exit 1; }
          grep -q 'voltando para spark-backend:baseline' /tmp/deploy-falha.log \
            || { echo "o rollback automático não aconteceu"; cat /tmp/deploy-falha.log; exit 1; }
          [ "$(running_tag)" = "baseline" ] \
            || { echo "não voltou para a versão anterior (no ar: $(running_tag))"; exit 1; }
          echo "ok: health falhou, o script voltou para a imagem anterior e saiu com erro"

          echo "--- 3. deploy real do commit atual: health interno aprova ---"
          ops/deploy.sh --skip-backup
          commit="$(git rev-parse --short=12 HEAD)"
          [ "$(running_tag)" = "$commit" ] \
            || { echo "a tag no ar não é o commit (no ar: $(running_tag))"; exit 1; }
          echo "ok: deploy concluído e ready, com o backend sem porta publicada"

          echo "--- 4. sem backup possível, o deploy aborta antes de tocar em produção ---"
          set +e
          ops/deploy.sh > /tmp/deploy-backup.log 2>&1
          code=$?
          set -e
          [ "$code" != "0" ] || { echo "o deploy seguiu sem ponto de recuperação"; exit 1; }
          grep -q 'backup pré-deploy falhou' /tmp/deploy-backup.log \
            || { echo "abortou por outro motivo"; cat /tmp/deploy-backup.log; exit 1; }
          [ "$(running_tag)" = "$commit" ] \
            || { echo "produção foi alterada apesar do backup ter falhado"; exit 1; }
          # E a falha do backup precisa ter ficado registrada (T16.8.1 §9).
          grep -q '"outcome": "FAILURE"' "$SPARK_STATE_DIR/backup-status.json" \
            || { echo "a falha do backup não foi registrada"; exit 1; }
          echo "ok: deploy abortado, produção intacta, falha do backup registrada"

          echo "--- 5. árvore suja: a tag da imagem precisa descrever o que sobe ---"
          echo "// sujeira temporária do teste" >> backend/src/main.ts
          set +e
          ops/deploy.sh --skip-backup > /tmp/deploy-sujo.log 2>&1
          code=$?
          set -e
          git checkout -- backend/src/main.ts
          [ "$code" != "0" ] || { echo "o deploy aceitou uma árvore suja"; exit 1; }
          grep -q 'não commitadas' /tmp/deploy-sujo.log \
            || { echo "abortou por outro motivo"; cat /tmp/deploy-sujo.log; exit 1; }
          echo "ok: deploy recusa árvore suja"

      - name: Limpeza
        if: always()
        run: |
          cd backend
          SPARK_IMAGE_TAG=topology docker compose -f docker-compose.prod.yml \
            -f docker-compose.ci-topology.yml down -v > /dev/null 2>&1 || true
          rm -f Caddyfile .env

  backup-drill:
    name: ensaio de backup e restauração
    runs-on: ubuntu-latest
    defaults:
      run:
        # A raiz, explicitamente: este job opera `ops/` e o contexto de build `backend/`. Era o
        # `defaults` global apontando para `backend` que fazia `docker build ... backend` procurar
        # `backend/backend` e o job inteiro morrer antes do primeiro ensaio (T16.8.1 §6).
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t spark-backend:local backend

      # O modelo de permissão host ↔ container, com o desencontro de uid construído de propósito
      # (T16.8.1 §3). Roda antes do ensaio porque é a pré-condição dele: um backup que não consegue
      # ler o arquivo que o container escreveu não é um backup.
      - name: Permissões com uid diferente entre host e container
        run: SPARK_IMAGE=spark-backend:local ops/tests/permissions.test.sh

      # O ensaio que importa (T16.8 §43/§161/§163): snapshot consistente com o banco **ativo**
      # recebendo escrita, verificação de integridade, restauração e o backend real subindo sobre
      # a cópia restaurada.
      #
      # Sem credencial de storage real: o CI normal não pode depender de um provedor pago, e não
      # deve guardar segredo para isso (§164). O que é exercitado aqui é a parte que quebra em
      # silêncio — o snapshot e a restauração. O envio off-site é validado manualmente, e está
      # documentado em docs/operations/BACKUP_AND_RESTORE.md.
      - name: Snapshot com o banco ativo, restauração e health
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          echo "SPARK_WORK=$WORK" >> "$GITHUB_ENV"
          mkdir -p "$WORK/data" "$WORK/media" "$WORK/backups" "$WORK/state"

          # Modelo de produção (T16.8.1 §3): setgid + grupo compartilhado. Era `chmod 777` aqui, e
          # `777` fazia o ensaio passar com qualquer combinação de uid — inclusive as que a
          # produção real não teria.
          chmod 2770 "$WORK/data" "$WORK/media"

          export SPARK_DATA_DIR="$WORK/data"
          export SPARK_MEDIA_DIR="$WORK/media"
          export SPARK_STAGING_DIR="$WORK/backups"
          export SPARK_STATE_DIR="$WORK/state"
          export SPARK_COMPOSE_DIR="$WORK/sem-compose"
          export SPARK_IMAGE=spark-backend:local
          export SPARK_BACKUP_ENV_FILE=/dev/null

          echo "uid do host: $(id -u) | grupo compartilhado: $(stat -c %g "$SPARK_DATA_DIR")"

          docker run -d --name drill-backend -p 127.0.0.1:8080:8080 \
            --group-add "$(stat -c %g "$SPARK_DATA_DIR")" \
            -v "$SPARK_DATA_DIR:/data" -v "$SPARK_MEDIA_DIR:/media" \
            -e DATABASE_PATH=/data/spark.db -e SOCIAL_MEDIA_ROOT=/media -e NODE_ENV=production \
            spark-backend:local
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/health/ready 2>/dev/null | grep -q '"status":"ok"' && break
            [ "$i" = 30 ] && { docker logs drill-backend; exit 1; }
            sleep 2
          done

          docker exec drill-backend node -e "
            const D=require('better-sqlite3'); const db=new D('/data/spark.db');
            db.prepare('INSERT INTO server_metadata (key,value,updated_at) VALUES (?,?,?)')
              .run('drill','presente',Date.now()); db.close();"

          # Um check-in com foto, semeado pelo caminho real do pipeline de imagem (T17.9 §142).
          #
          # O ponto do ensaio é que o backup passou a ter **duas** coisas: o banco e os arquivos.
          # Um snapshot que levasse só `spark.db` restauraria um Feed apontando para fotos que não
          # existem — íntegro pelo `integrity_check` e quebrado na tela de quem abrisse.
          docker exec drill-backend node -e "
            const D=require('better-sqlite3'); const sharp=require('sharp');
            const fs=require('node:fs'); const path=require('node:path');
            (async()=>{
              const db=new D('/data/spark.db'); db.pragma('foreign_keys = ON');
              const now=Date.now();
              db.prepare('INSERT INTO social_profiles (owner_uid, social_id, display_name, friend_code, status, created_at, updated_at) VALUES (?,?,?,?,?,?,?)')
                .run('uid-drill','11111111-1111-4111-8111-111111111111','Drill','SPK-DRILL01','ACTIVE',now,now);
              db.prepare('INSERT INTO social_workout_checkins (id, author_uid, source_session_sync_id, client_request_id, status, caption, created_at, deleted_at) VALUES (?,?,?,?,?,?,?,NULL)')
                .run('checkin-drill','uid-drill','sessao-drill','req-drill','PUBLISHED','legenda do ensaio',now);
              const bytes=await sharp({create:{width:64,height:64,channels:3,background:{r:9,g:9,b:9}}}).webp().toBuffer();
              const key='checkins/aa/bb/aabb0000-0000-4000-8000-000000000001.webp';
              fs.mkdirSync(path.dirname('/media/'+key),{recursive:true});
              fs.writeFileSync('/media/'+key,bytes,{mode:0o640});
              db.prepare('INSERT INTO social_checkin_media (id,owner_uid,source_session_sync_id,client_upload_id,storage_key,mime_type,byte_size,width,height,content_hash,status,created_at,expires_at,attached_checkin_id,deleted_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,NULL,?,NULL)')
                .run('media-drill','uid-drill','sessao-drill','upload-drill',key,'image/webp',bytes.length,64,64,'hash','ATTACHED',now,'checkin-drill');
              db.close();
              console.log('check-in com foto semeado:', bytes.length, 'bytes');
            })();"

          # Escrita concorrente durante o snapshot: em WAL, VACUUM INTO não pode bloquear o
          # servidor, e um snapshot rasgado por escrita concorrente é exatamente o defeito que
          # `cp spark.db` produziria.
          #
          # Um processo só, escrevendo em laço por tempo determinado, e não um `docker exec` por
          # iteração: o custo de subir um processo por escrita fazia a carga terminar antes de o
          # snapshot começar, e a sobreposição — que é o ponto do ensaio — acontecia por sorte.
          docker exec -d drill-backend node -e "
            const D=require('better-sqlite3'); const db=new D('/data/spark.db');
            const insert=db.prepare('INSERT OR REPLACE INTO server_metadata (key,value,updated_at) VALUES (?,?,?)');
            const fim=Date.now()+20000;
            let n=0;
            while (Date.now() < fim) { insert.run('carga_'+(n++),'x',Date.now()); }
            db.prepare('INSERT OR REPLACE INTO server_metadata (key,value,updated_at) VALUES (?,?,?)')
              .run('carga_total', String(n), Date.now());
            db.close();"

          sleep 2
          SNAP="$(ops/snapshot.sh)"
          test -s "$SNAP"
          echo "SPARK_SNAPSHOT=$SNAP" >> "$GITHUB_ENV"

          # O snapshot foi tirado com escrita em curso, e precisa estar íntegro assim mesmo.
          # `--user` de novo pelo mesmo motivo: `ops/snapshot.sh` grava o snapshot com `600` e dono
          # do operador — deliberadamente, porque é dado pessoal do servidor esperando o envio
          # off-site. Quem o inspeciona precisa ser o dono, não o `node` da imagem.
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$(dirname "$SNAP"):/s" --entrypoint node spark-backend:local -e "
            const D=require('better-sqlite3');
            const db=new D('/s/$(basename "$SNAP")',{readonly:true});
            const integridade=db.pragma('integrity_check',{simple:true});
            if (integridade !== 'ok') { console.error('integrity_check: '+integridade); process.exit(1); }
            const orfaos=db.pragma('foreign_key_check');
            if (orfaos.length > 0) { console.error('foreign_key_check: '+orfaos.length); process.exit(1); }
            const row=db.prepare('SELECT value FROM server_metadata WHERE key=?').get('drill');
            if (!row || row.value !== 'presente') { console.error('o snapshot não tem o dado'); process.exit(1); }
            // T17.9 §142 — a metadata da mídia veio no snapshot do banco. Os **bytes** são
            // verificados depois, pelo ensaio de restauração, que sobe o backend sobre a cópia.
            const media=db.prepare('SELECT COUNT(*) n FROM social_checkin_media').get().n;
            if (media !== 1) { console.error('a metadata de mídia não entrou no snapshot'); process.exit(1); }
            const carga=db.prepare(\"SELECT COUNT(*) n FROM server_metadata WHERE key LIKE 'carga\_%' ESCAPE '\\\\'\").get().n;
            if (carga < 1) { console.error('nenhuma escrita concorrente foi capturada'); process.exit(1); }
            console.log('snapshot íntegro sob escrita concorrente; linhas de carga:', carga);
            db.close();"

          # Restauração + integrity_check + backend real ready sobre a cópia, **com a mídia**
          # (T17.9 §142/§190). O último passo do ensaio lê os bytes de dentro do container, como o
          # processo de produção leria: o modelo de grupo compartilhado precisa sobreviver à
          # restauração, e "o arquivo está lá" não prova que ele abre.
          SPARK_DRILL_DIR="$WORK/drill" ops/verify-backup.sh \
            --from-file "$SNAP" --media-from "$SPARK_MEDIA_DIR" --port 18082

          docker rm -f drill-backend

      # Todo desfecho do backup chega ao estado operacional (T16.8.1 §9). Sem isto, um caminho de
      # falha que não escrevesse `backup-status.json` deixaria o monitoramento afirmando que existe
      # backup quando não existe — que é pior que não ter backup, porque dá confiança.
      - name: Todo desfecho do backup vira estado (sucesso e todas as falhas)
        run: SPARK_IMAGE=spark-backend:local ops/tests/backup-status.test.sh "$SPARK_WORK/data"
